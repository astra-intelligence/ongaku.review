# Dependabot の設定
# 依存関係の更新PRを毎週金曜日の00:00 (Asia/Tokyo) に作成する。
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # package.json と package-lock.json の依存関係
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
    groups:
      # minor と patch は1つのPRにまとめる。major は個別のPRにする。
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # .github/workflows のワークフローで使うアクション
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
